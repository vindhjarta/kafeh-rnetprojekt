<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kafé Hörnet – Boka bord</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="index.html">Kafé Hörnet</a>
      <nav>
        <a href="index.html">Start</a>
        <a href="menu.html">Meny</a>
        <a href="booking.html">Boka bord</a>
      </nav>
    </header>
    <main>
      <h1>Boka bord</h1>
      <p>
        Fyll i formuläret så bekräftar vi via e-post inom en timme under
        öppettid. Sällskap över 8 personer: ring oss.
      </p>
      <form id="booking-form" novalidate>
        <div>
          <label for="name">Namn</label>
          <input type="text" id="name" name="name" />
          <p id="name-error"></p>
        </div>
        <div>
          <label for="email">E-post</label>
          <input type="email" id="email" name="email" />
          <p id="email-error"></p>
        </div>
        <div>
          <label for="date">Datum</label>
          <input type="date" id="date" name="date" />
          <p id="date-error"></p>
        </div>
      </form>
    </main>
    <footer>
      <p>© Kafé Hörnet 2026</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
